# Mekanism for Horizon — slices 1–15: the ore-processing machines, the cable, the chemical chain, the basic factories, the washer, the crystallizer, its seven crystals, the crystal → shard injection leg, the four extra metals' ore chain, the smelting sweep, the storage-block and nugget family, and the chemical dissolution chamber that heads the slurry chain.
#
# Migrated 2026-11-18 from the retired `.hnmod` container (Horizon's mod-API merge
# #16941; the registry closed every `.hnmod` submission with the format purge).
# This manifest is the only one: identity, the content capability and the exact
# native pins. `assets/` and `data/` are the carried content (twenty blocks,
# forty-five items, their models, textures, blockstates, recipes, loot, tag and
# lang), `src/` is the port's code; both halves travel in one file.
#
# Licence: MIT, read from the jar's `META-INF/neoforge.mods.toml` (rank 0,
# permissive). `LICENSE` and `LICENSE-NOTICE.md` travel inside the package, and
# the same two texts ride in the content half as `data/mekanism/license/`.
# Local-only until the maintainer approves publishing (ARCHITECTURE.md §8).
id = "mekanism"
name = "Mekanism"
version = "0.2.17"
description = """A port of Mekanism for Horizon, slices 1-11. The ore-processing machines: the
Energized Smelter, the Enrichment Chamber and the Crusher (50 FE/t, 200 ticks and 10,000 FE per
operation, a 20,000 FE buffer, three slots and the vanilla furnace menu, the jar's smelting,
enriching and crushing recipes over the items this port registers), the Basic Energy Cube
(4,000,000 FE at 4,000 FE/t) and the Basic Universal Cable (an 8,000 FE buffer moving energy between
the block entities beside it). Slice 4 is the chemical capability this pack's integrations ask for
and no Horizon build publishes: the `mekanism:chemical` block capability (one tank, 64,000 units,
`chemical` + `amount` in the block entity's saved data), the Basic Chemical Tank that answers it,
and the Gauge Dropper item that carries 16,000 units of one chemical in its `mekanism:chemical`
component through the item side of the same capability. Slice 5 is its first consumer: the Chemical
Injection Chamber (400 FE/t, 200 ticks, a 160,000 FE buffer and a 210-unit gas tank it tops up from
an adjacent tank through `mekanism:chemical`) runs the jar's `mekanism:injecting` recipes over the
items this port has — raw ore and ore into shards, the vanilla solidifying, coral, oxidising and
mud families — and adds the iron, gold and copper shards. Slice 6 is the Purification Chamber: the
same gas machine on oxygen (200 FE/t, 200 ticks, a 40,000 FE operation, an 80,000 FE buffer and the
same 210-unit tank) running the jar's `mekanism:purifying` clump recipes — ore into 3 clumps, raw
ore into 2, a raw block into 18 and a shard into 1 — and adding the iron, gold and copper clumps and
dirty dusts, so the jar's chain works end to end: a clump crushes into a dirty dust and that dirty
dust enriches into a dust. Slice 7 is the basic factory family: the five Basic factories (smelting,
enriching, crushing, injecting and purifying), each running three processes of the same recipe side
by side — one input and one output slot per process, its own progress, one shared buffer of half the
base machine's storage per process (30,000 FE for the item machines, 240,000 for the injecting
factory and 120,000 for the purifying one) and, for the two gas factories, one shared 630-unit tank —
so three ore in a basic purifying factory become nine clumps for 3 x 40,000 FE and 600 oxygen while
one ore costs one operation. `/mekanism info` and `/mekanism chemical insert|drain` need an operator
or a player within 8 blocks. Slice 8 is the Chemical Washer, the port's first machine with a **fluid**
input: 200 FE/t, 200 ticks and 40,000 FE an operation, an 80,000 FE buffer, a 10,000 mB water tank
declared through the game's own `horizon:fluids` capability (its contents in the `fluids` list the
block entity saves) and two 10,000-unit slurry tanks through `mekanism:chemical` (dirty in, clean
out), running the jar's seven `mekanism:washing` recipes — 5 mB of water and one unit of a dirty
slurry into one unit of its clean slurry, for copper, gold, iron, lead, osmium, tin and uranium — and
carrying the jar's own model and textures for it. Slice 9 is the Chemical Crystallizer, the washer's
consumer: 400 FE/t, 200 ticks and 80,000 FE an operation, a 160,000 FE buffer (exactly two
operations), a 10,000-unit tank that takes a clean slurry with a row and nothing else, and one output
slot — 200 units of a clean slurry make one `mekanism:crystal_<material>` item, the art the jar's own,
and a hopper under the output slot pulls the crystals out. Slice 10 carries the four crystals the
washer's remaining slurries needed, so all **seven** crystallizing rows run — copper, gold, iron,
lead, osmium, tin and uranium — and no washer recipe dead-ends at the crystallizer. Slice 11 carries
the crystal → shard leg: the jar's seven `processing/<material>/shard/from_crystal` rows run in the
Chemical Injection Chamber — one `crystal_<material>` plus one unit of hydrogen chloride a tick for
200 ticks become one `shard_<material>` for 80,000 FE — and registers the four shards the jar's own
ores cannot reach here (lead, osmium, tin, uranium), so every crystal the port crystallizes continues
into the ore-processing chain. Slice 12 is the rest of the ore chain for those four metals:
`mekanism:clump_{lead,osmium,tin,uranium}`, `mekanism:dirty_dust_{lead,osmium,tin,uranium}`,
`mekanism:dust_{lead,osmium,tin,uranium}` and `mekanism:ingot_{lead,osmium,tin,uranium}` join the
jar's own art, names and tab entries, so the crushing table runs clump → dirty dust (152 rows), the
enriching table dirty dust → dust (136) and the Energized Smelter's own rows dust → ingot (7) for all
seven materials — and the port's first **enriching sweep** proves every one of the 136 rows in a real
machine. Slice 13 sweeps the smelting table the Energized Smelter has carried since slice 1: every
carried `minecraft:smelting` row — the 163 the 26.3 data expands to and the jar's own seven dust ->
ingot rows — runs in a real smelter with its input consumed and its declared output stack, and the
crusher gains the jar's four `c:ingots/<m>` -> dust rows for lead, osmium, tin and uranium (156
crushing rows). Slice 14 is the storage-block and nugget family the four metals were missing:
`mekanism:block_{lead,osmium,tin,uranium}` (the jar's own art, the upstream hardness/resistance per
metal, self-drop loot, `mineable/pickaxe` and `beacon_base_blocks`) and `mekanism:nugget_*` join the
package with all sixteen of the jar's recipes between blocks, ingots and nuggets — a 3x3 block from
nine ingots and a 3x3 ingot from nine nuggets over the `c:ingots`/`c:nuggets` tags the port now
declares, plus the shapeless nine-ingots-from-a-block and nine-nuggets-from-an-ingot rows — every one
crafted in game. Slice 15 is the Chemical Dissolution Chamber, the head of the slurry chain: 400 FE/t,
100 ticks and 40,000 FE an operation, a 160,000 FE buffer, two 10,000-unit tanks through
`mekanism:chemical` (sulfuric acid in, dirty slurry out) and one input slot, running the jar's
`mekanism:dissolution` recipes this port has items for — three 26.3 ores (stone and deepslate), their
raw ores and their raw blocks, 1,000/2,000/6,000 units of dirty slurry each — with the acid spent
per tick (100 units an operation for an ore) from a neighbour tank. What it makes is what the washer
beside it takes. Slice 16 proves all twelve carried dissolution rows in real chambers. Slice 17 is
the acid chain head that makes that acid locally: the Chemical Oxidizer (200 FE/t, 100 ticks and
20,000 FE an operation, an 80,000 FE buffer and a 10,000-unit gas tank) turns one sulfur dust into
100 units of SO2, and the Chemical Infuser (200 FE/t, one tick an operation, an 80,000 FE buffer and
three 10,000-unit tanks) runs the jar's two acid rows — oxygen + 2 SO2 -> 2 SO3 and SO3 + water
vapour -> sulfuric acid — pushing its product to the neighbour through `mekanism:chemical`, so the
dissolution chamber runs from a locally made source. Slice 18 is the Electrolytic Separator — the tail of that feed: 400 FE/t (2 x hydrogen energy density), one tick an operation, a 160,000 FE buffer, one 24,000 mB `horizon:fluids` water tank and two 2,400-unit output tanks through `mekanism:chemical`; the jar's water row splits 2 mB of water into 2 hydrogen and 1 oxygen, pushed to neighbouring tanks so the infuser no longer needs hand-inserted gas. Slice 19 is the rotary Condensentrator — 50 FE/t, one tick an operation, a 20,000 FE buffer, one 10,000 mB `horizon:fluids` water tank and one 10,000-unit `mekanism:chemical` gas tank; the jar's `water_vapor` row turns 1 mB of water into 1 unit of water vapour, pushed to a neighbouring tank, so the acid chain's last hand-filled gas is made locally. Not ported: the rest of Mekanism — the advanced,
elite and ultimate factory tiers, the pigments, upgrades, side configuration, the Configurator, the
Digital Miner, the Teleporter, jetpacks, the multiblocks and the mod's own GUIs."""
authors = ["Aidan C. Brady", "AdLf0208"]
# The content API: exact and checked. This package ships carried content beside its code, so the
# capability is a real claim; it is also the one value the manifest schema has.
api = "0.2"
