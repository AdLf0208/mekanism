# Mekanism for Horizon — slices 1–9: the ore-processing machines, the cable, the chemical chain, the basic factories, the washer and the crystallizer.
#
# Migrated 2026-11-18 from the retired `.hnmod` container (Horizon's mod-API merge
# #16941; the registry closed every `.hnmod` submission with the format purge).
# This manifest is the only one: identity, the content capability and the exact
# native pins. `assets/` and `data/` are the carried content (fifteen blocks,
# sixteen items, their models, textures, blockstates, recipes, loot, tag and lang),
# `src/` is the port's code; both halves travel in one file.
#
# Licence: MIT, read from the jar's `META-INF/neoforge.mods.toml` (rank 0,
# permissive). `LICENSE` and `LICENSE-NOTICE.md` travel inside the package, and
# the same two texts ride in the content half as `data/mekanism/license/`.
# Local-only until the maintainer approves publishing (ARCHITECTURE.md §8).
id = "mekanism"
name = "Mekanism"
version = "0.2.8"
description = """A port of Mekanism for Horizon, slices 1-9. The ore-processing machines: the
Energized Smelter, the Enrichment Chamber and the Crusher (50 FE/t, 200 ticks and 10,000 FE per
operation, a 20,000 FE buffer, three slots and the vanilla furnace menu, the jar's smelting,
enriching and crushing recipes over the items this port registers), the Basic Energy Cube
(4,000,000 FE at 4,000 FE/t) and the Basic Universal Cable (an 8,000 FE buffer moving energy between
the block entities beside it). Slice 4 is the chemical capability this pack's integrations ask for
and no Horizon build publishes: the `mekanism:chemical` block capability (one tank, 64,000 units,
`chemical` + `amount` in the block entity's saved data), the Basic Chemical Tank that answers it,
and the Gauge Dropper item that carries 16,000 units of one chemical in its `mekanism:chemical`
component through the item side of the same capability. Slice 5 is its first consumer: the Chemical
Injection Chamber (400 FE/t, 200 ticks, a 160,000 FE buffer and a 210-unit gas tank it tops up from
an adjacent tank through `mekanism:chemical`) runs the jar's `mekanism:injecting` recipes over the
items this port has — raw ore and ore into shards, the vanilla solidifying, coral, oxidising and
mud families — and adds the iron, gold and copper shards. Slice 6 is the Purification Chamber: the
same gas machine on oxygen (200 FE/t, 200 ticks, a 40,000 FE operation, an 80,000 FE buffer and the
same 210-unit tank) running the jar's `mekanism:purifying` clump recipes — ore into 3 clumps, raw
ore into 2, a raw block into 18 and a shard into 1 — and adding the iron, gold and copper clumps and
dirty dusts, so the jar's chain works end to end: a clump crushes into a dirty dust and that dirty
dust enriches into a dust. Slice 7 is the basic factory family: the five Basic factories (smelting,
enriching, crushing, injecting and purifying), each running three processes of the same recipe side
by side — one input and one output slot per process, its own progress, one shared buffer of half the
base machine's storage per process (30,000 FE for the item machines, 240,000 for the injecting
factory and 120,000 for the purifying one) and, for the two gas factories, one shared 630-unit tank —
so three ore in a basic purifying factory become nine clumps for 3 x 40,000 FE and 600 oxygen while
one ore costs one operation. `/mekanism info` and `/mekanism chemical insert|drain` need an operator
or a player within 8 blocks. Slice 8 is the Chemical Washer, the port's first machine with a **fluid**
input: 200 FE/t, 200 ticks and 40,000 FE an operation, an 80,000 FE buffer, a 10,000 mB water tank
declared through the game's own `horizon:fluids` capability (its contents in the `fluids` list the
block entity saves) and two 10,000-unit slurry tanks through `mekanism:chemical` (dirty in, clean
out), running the jar's seven `mekanism:washing` recipes — 5 mB of water and one unit of a dirty
slurry into one unit of its clean slurry, for copper, gold, iron, lead, osmium, tin and uranium — and
carrying the jar's own model and textures for it. Slice 9 is the Chemical Crystallizer, the washer's
consumer: 400 FE/t, 200 ticks and 80,000 FE an operation, a 160,000 FE buffer (exactly two
operations), a 10,000-unit tank that takes a clean slurry with a row and nothing else, and one output
slot — 200 units of a clean slurry make one `mekanism:crystal_<material>` item, the jar's three rows
this port has crystals for (iron, gold, copper) all carried, the art the jar's own, and a hopper under
the output slot pulls the crystals out. Not ported: the rest of Mekanism — the advanced,
elite and ultimate factory tiers, the dissolution chamber, the pigments,
upgrades, side configuration, the Configurator, the Digital Miner, the Teleporter, jetpacks, the
multiblocks and the mod's own GUIs."""
authors = ["Aidan C. Brady", "AdLf0208"]
# The content API: exact and checked. This package ships carried content beside its code, so the
# capability is a real claim; it is also the one value the manifest schema has.
api = "0.2"
# The installation side, not the hook's: the machines and the cable run on the server, and a LAN
# host or single-player world runs them inside the client installation.
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
