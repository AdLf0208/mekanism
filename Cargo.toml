[package]
# Port of Mekanism 10.7.19.85 (mekanism/Mekanism, MIT, tag v1.21.1-10.7.19.85
# at a00109e4856fd38b9c5b3dd7f22ce4a59cd65a80). Minecraft Java 1.21.1 NeoForge;
# the port targets Horizon 26.3 at the pin in horizon-mod.toml. Clean-room Rust
# rewrite from the mod's behaviour (notes.md, FINDINGS.md); local-only until the
# maintainer approves publishing, publishable under MIT with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "mekanism"
version = "0.2.15"
edition = "2024"
license = "MIT"
description = "Mekanism for Horizon: the Energized Smelter, the Enrichment Chamber, the Crusher, the Basic Energy Cube, the Basic Universal Cable, the chemical capability (the Basic Chemical Tank and the Gauge Dropper), its consumers the Chemical Injection Chamber (raw ore into shards, and every crystal the crystallizer makes into its material's shard) and the Purification Chamber, the five basic factories, the Chemical Washer (a fluid input through horizon:fluids) the Chemical Crystallizer (a clean slurry into a crystal, for all seven slurries the washer makes), the four extra metals' ore chain (clump -> dirty dust -> dust -> ingot), the smelting sweep (every carried smelting row in a real smelter) with the four ingot -> dust crushing rows, the storage-block and nugget family (four blocks, four nuggets and the jar's sixteen recipes between blocks, ingots and nuggets), and the Chemical Dissolution Chamber (an ore and sulfuric acid per tick into a dirty slurry: 400 FE/t, 100 ticks and 40,000 FE an operation, a 160,000 FE buffer and two 10,000-unit tanks), and the acid chain head (a Chemical Oxidizer turning sulfur dust into SO2 for 200 FE/t and 20,000 FE an operation, and a Chemical Infuser running the jar's SO2 + oxygen -> SO3 and SO3 + water vapour -> sulfuric acid rows at 200 FE/t, so the dissolution chamber runs on locally made acid)"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
